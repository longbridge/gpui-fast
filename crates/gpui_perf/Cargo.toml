[package]
name = "gpui_perf"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Simulated application scenarios — forms, lists, tables — for measuring GPUI frame cost automatically"

[lints]
workspace = true

[lib]
path = "src/gpui_perf.rs"
doctest = false

[[bin]]
name = "gpui_perf"
path = "src/main.rs"

[[example]]
name = "views_frames"
required-features = ["fast"]

[[example]]
name = "native_webview"
required-features = ["fast"]

[[test]]
name = "windows_manifest_coexistence"
required-features = ["fast", "upstream"]

[features]
default = ["fast"]
# Build against this repository's GPUI: the showcase, `--headless` and the
# examples, with gpui-fast's counters.
fast = ["dep:gpui_fast", "dep:gpui_platform_fast", "dep:gpui_wgpu"]
# Build the showcase against upstream GPUI instead, the `gpui-pre` snapshot
# GPUI Kit pins, to compare the two on the same screens:
# `cargo run -p gpui_perf --release --features upstream`, or with
# `--no-default-features` too, to skip building this repository's GPUI.
upstream = ["dep:gpui_pre", "dep:gpui_pre_platform", "gpui_fast?/windows-manifest-provided-by-host"]

[dependencies]
# Named `gpui_fast` and `gpui_platform_fast` so that either GPUI can be named
# `gpui` by the crate roots; see `src/main.rs`.
gpui_fast = { package = "gpui", path = "../gpui", default-features = false, features = ["test-support"], optional = true }
gpui_platform_fast = { package = "gpui_platform", path = "../gpui_platform", default-features = false, features = ["font-kit", "wayland", "x11"], optional = true }
gpui_wgpu = { workspace = true, optional = true }
gpui_pre = { package = "gpui-pre", version = "=0.3.7", optional = true }
gpui_pre_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "x11", "wayland"], optional = true }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
smol.workspace = true

# The native_webview example: a WKWebView on macOS, WebView2 on Windows, and
# its own wgpu device drawing into a native surface on Linux.
[dev-dependencies]
anyhow.workspace = true
log.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
cocoa.workspace = true
objc.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
# 0.39 rather than zed-industries/zed#62379's 0.38, which is built on windows
# 0.61: gpui_windows hands out windows 0.62's `IUnknown`.
webview2-com = "0.39"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
wgpu.workspace = true
