name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (first release: v0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Validate without uploading to crates.io'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Require a tag on main
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Check upstream constraints
        if: runner.os == 'Linux'
        run: python3 script/check-upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare release manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -m pip install tomlkit==0.13.3
          python script/prepare-release --tag "$RELEASE_TAG"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: target/release-workspace

      - name: Check registry-only release dependencies
        run: |
          cargo check --manifest-path target/release-workspace/Cargo.toml --workspace --lib
          cargo check --manifest-path target/release-workspace/Cargo.toml --workspace --lib --all-features

      - name: Check Web backend
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown
          cargo +nightly check --manifest-path target/release-workspace/Cargo.toml -p gpui-fast-web --lib --target wasm32-unknown-unknown

      - name: Validate package contents and release order
        run: python script/publish-release

      - name: Upload prepared release
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-workspace
          path: |
            target/release-workspace/*/Cargo.toml
            target/release-workspace/*/README.md
            target/release-workspace/*/LICENSE
            target/release-workspace/*/NOTICE
            target/release-workspace/*/build.rs
            target/release-workspace/*/src
            target/release-workspace/Cargo.toml
            target/release-workspace/Cargo.lock
            target/release-workspace/rust-toolchain.toml

  publish:
    name: Publish to crates.io
    needs: validate
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: release-workspace
          path: target/release-workspace

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: target/release-workspace

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python script/publish-release --publish
