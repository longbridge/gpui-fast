# Modified by Longbridge for gpui-fast publication.
[package]
name = "gpui-fast-platform"
version = "0.1.7"
edition = "2024"
publish = ["crates-io"]
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-fast"
homepage = "https://github.com/longbridge/gpui-fast"
readme = "README.md"
documentation = "https://docs.rs/gpui-fast-platform/0.1.7/gpui_platform/"
description = "gpui_platform: GPUI with gpui-fast rendering and layout optimizations"
autoexamples = false
autobenches = false
autotests = false
authors = ["Longbridge"]
include = ["/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
path = "src/gpui_platform.rs"
doctest = false
name = "gpui_platform"

[features]
default = []
bench-support = ["gpui/bench-support", "gpui_macos/bench-support", "gpui_wgpu/bench-support"]
font-kit = ["gpui_macos/font-kit"]
inspector = ["gpui/inspector"]
test-support = ["gpui/test-support", "gpui_macos/test-support", "gpui_windows/test-support", "gpui_wgpu/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.gpui]
default-features = false
package = "gpui-fast"
version = "^0.1.7"
path = "../gpui"

[target."cfg(target_os = \"macos\")".dependencies.gpui_macos]
default-features = false
package = "gpui-fast-macos"
version = "^0.1.7"
path = "../gpui_macos"

[target."cfg(target_os = \"windows\")".dependencies.gpui_windows]
default-features = false
package = "gpui-fast-windows"
version = "^0.1.7"
path = "../gpui_windows"

[target."cfg(target_os = \"windows\")".dependencies.gpui]
default-features = false
features = ["windows-manifest"]
package = "gpui-fast"
version = "^0.1.7"
path = "../gpui"

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\"))".dependencies.gpui_linux]
default-features = false
package = "gpui-fast-linux"
version = "^0.1.7"
path = "../gpui_linux"

[target."cfg(target_os = \"linux\")".dependencies.gpui_wgpu]
optional = true
package = "gpui-fast-wgpu"
version = "^0.1.7"
path = "../gpui_wgpu"

[target."cfg(target_family = \"wasm\")".dependencies.gpui_web]
package = "gpui-fast-web"
version = "^0.1.7"
path = "../gpui_web"

[target."cfg(target_family = \"wasm\")".dependencies.console_error_panic_hook]
version = "0.1.7"

[lints.rust.unexpected_cfgs]
level = "allow"
